# --- Déploiement de l'application : 2 réplicas, mise à jour progressive ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # au plus 1 pod en plus pendant la mise à jour
      maxUnavailable: 0    # jamais moins de 2 pods prêts
  selector:
    matchLabels:
      app: student-app
  template:
    metadata:
      labels:
        app: student-app
    spec:
      # Attend que MySQL réponde avant de lancer Spring Boot
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c",
                    "until nc -z mysql 3306; do echo 'MySQL indisponible'; sleep 3; done"]
      containers:
        - name: app
          image: souhajomaa1412/student-management:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8089
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
          # Prêt à recevoir du trafic ? (l'API OpenAPI de springdoc répond)
          readinessProbe:
            httpGet:
              path: /student/v3/api-docs
              port: 8089
            initialDelaySeconds: 30
            periodSeconds: 10
          # Toujours vivant ? sinon Kubernetes redémarre le conteneur
          livenessProbe:
            tcpSocket:
              port: 8089
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              memory: "300Mi"
            limits:
              memory: "512Mi"
---
# --- Service NodePort : port 30089 ouvert sur le nœud Minikube ---
apiVersion: v1
kind: Service
metadata:
  name: student-app
spec:
  type: NodePort
  selector:
    app: student-app
  ports:
    - port: 8089
      targetPort: 8089
      nodePort: 30089
