spring.application.name=student-management
spring.datasource.url=jdbc:mysql://localhost:3306/studentdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Server configuration :
server.port=8089
server.servlet.context-path=/student

# --- Supervision (à ajouter dans application.properties) ---
# Points d'entrée Actuator exposés en HTTP (préfixe : /student/actuator)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Détail de la santé (base de données, espace disque...) visible par tous
management.endpoint.health.show-details=always
# /actuator/health/liveness et /actuator/health/readiness pour Kubernetes
management.endpoint.health.probes.enabled=true
# Étiquette "application" ajoutée à toutes les métriques
management.metrics.tags.application=student-management
